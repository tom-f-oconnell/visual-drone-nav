[project]
name = "visnav"
version = "0.1.0"
description = "Onboard NAIP image-based navigation for ArduPilot (Jetson companion computer)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "rasterio>=1.3.9", "pyproj>=3.6", "pymavlink>=2.4.40"]

[project.optional-dependencies]
pip-opencv = ["opencv-python-headless>=4.8"]

[project.scripts]
visnav = "visnav.main:main"

[tool.setuptools]
packages = ["visnav"]

[tool.setuptools.package-data]
visnav = ["static/*"]
