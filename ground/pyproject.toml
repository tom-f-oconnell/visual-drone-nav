[project]
name = "naip-planner"
version = "0.1.0"
description = "Web flight planner that caches NAIP imagery and exports ArduPilot mission bundles"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5", "numpy>=1.26", "rasterio>=1.3.9",
  "pyproj>=3.6", "shapely>=2.0", "opencv-python-headless>=4.8", "pystac-client>=0.7",
  "planetary-computer>=1.0",
]

[tool.setuptools]
packages = ["planner"]

[tool.setuptools.package-data]
planner = ["static/*"]
